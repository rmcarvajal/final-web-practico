name: tool-lab-final-exam

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tool_lab
      POSTGRES_USER: tool_lab
      POSTGRES_PASSWORD: tool_lab_local
    ports:
      - "127.0.0.1:5452:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tool_lab -d tool_lab"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

